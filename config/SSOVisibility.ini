; SSO Visibility 1.2.2 -- 1 means hide, 0 means native behavior.
; Ctrl+Numpad0 is immutable: all supported categories ON, gameplay guards OFF.
; Ctrl+Numpad1..9 selects and enables a preset. F5 enables; F6 restores.
; Edit and press F7 in game to reload. Keep NumLock on.
; 0..4 are aggressive. 5..9 preserve known quest/race/trigger ancestry.
; Default 8 hides only other players' horses, riders and pets.
; AllParticles is deliberately broad and can hide race/quest particle cues.
; Gameplay guards are conservative type/name checks, not a complete race asset database.
[General]
DefaultPreset=8

[Preset1]
Name=Aggressive: keep quest markers
ProtectGameplay=0
PlayerHorses=1
PlayerActors=1
PlayerPets=1
NpcPets=1
NpcActors=1
NpcHorses=1
StandaloneHorses=1
SaleHorses=1
Coins=1
QuestMarkers=0
NpcText=1
AmbientParticles=1
AllParticles=1
DetailGrass=1

